<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ofertas</title>
  <link rel="stylesheet" href="./css/offers.css" />
  <!-- Iconos de Font Awesome (para el ícono de WhatsApp) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    /* Opcional: estilo para el texto nuevo si no quieres tocar offers.css */
    .promo-note{ margin-top:10px; font-weight:700; }
  </style>
</head>
<body>
  <!-- HEADER -->
  <div class="offers-header">
    <a href="./select.html" class="back-button">←</a>
    <h2>OFERTAS</h2>
  </div>

  <div class="offers-container">
    <!-- Oferta 1 -->
    <div class="offer-card">
      <img src="./img/productos/pana/pana-1.webp" alt="Camisa Básica">
      <div class="offer-info">
        <h3>Promo Camisas</h3>
        <p>Llévate la segunda al 50% de descuento.</p>

        <!-- ✔ Solo el texto solicitado -->
        <div class="promo-note">Pregunta por nuestra promo de camisas 2x1</div>
      </div>
    </div>
  </div>

  <!-- FOOTER (lo dejo igual) -->
  <div class="cart-footer">
    <button class="more-info pay" data-nombre="Promo Camisa Básica">Más info <i class="fa-brands fa-whatsapp"></i></button>

  </div>

  <!-- Script -->
  <script src="./js/offers.js"></script>
</body>
</html>
