<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menú</title>
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
  <!-- HEADER -->
  <div class="cart-header">
    <a href="./select.html" class="back-button">←</a>
    <h2>MENÚ</h2>
  </div>

  <!-- BARRA DE ANUNCIOS -->
  <div class="anuncio-bar">
    <p>
      !Por Compras superiores a 6 unidades por referencia lleva precio MAYORISTA¡ ✨  
    </p>
  </div>


  <!-- CATEGORÍAS -->
  <div class="categorias-container">
    <button class="categoria-btn" onclick="filtrarBotonCategoria(this, 'camisa jean')">
      <img src="./img/camisa-numeral.webp" alt="Chicken" />
      <span>Camisa Jean</span>
    </button>
    <button class="categoria-btn" onclick="filtrarBotonCategoria(this, 'leñador')">
      <img src="./img/camisa-de-cuadros.webp"/>
      <span>Leñador</span>
    </button>
    <button class="categoria-btn" onclick="filtrarBotonCategoria(this, 'unicolor')">
      <img src="./img/camisa-manga-larga.webp"/>
      <span>Unicolor</span>
    </button>
    <button class="categoria-btn" onclick="filtrarBotonCategoria(this, 'pana')">
      <img src="./img/camisa-tres-rayas.webp" alt="Chicken" />
      <span>Pana</span>
    </button>
    <button class="categoria-btn" onclick="filtrarBotonCategoria(this, 'textura')">
      <img src="./img/camisa-numeral.webp" />
      <span>Textura</span>
    </button>
    <button class="categoria-btn" onclick="filtrarBotonCategoria(this, 'jean')">
      <img src="./img/jeans.webp" />
      <span>Pantalones</span>
    </button>
  </div>

  <!-- Modal -->
  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>Selecciona tus tallas</h3>

      <div class="talla-control" data-talla="2">
        <span>2</span>
        <button class="menos-talla">−</button>
        <span class="cantidad-talla">0</span>
        <button class="mas-talla">+</button>
      </div>

      <div class="talla-control" data-talla="4">
        <span>4</span>
        <button class="menos-talla">−</button>
        <span class="cantidad-talla">0</span>
        <button class="mas-talla">+</button>
      </div>

      <div class="talla-control" data-talla="6">
        <span>6</span>
        <button class="menos-talla">−</button>
        <span class="cantidad-talla">0</span>
        <button class="mas-talla">+</button>
      </div>

      <div class="talla-control" data-talla="8">
        <span>8</span>
        <button class="menos-talla">−</button>
        <span class="cantidad-talla">0</span>
        <button class="mas-talla">+</button>
      </div>

      <div class="talla-control" data-talla="10">
        <span>10</span>
        <button class="menos-talla">−</button>
        <span class="cantidad-talla">0</span>
        <button class="mas-talla">+</button>
      </div>

      <div class="talla-control" data-talla="12">
        <span>12</span>
        <button class="menos-talla">−</button>
        <span class="cantidad-talla">0</span>
        <button class="mas-talla">+</button>
      </div>

      <div class="talla-control" data-talla="14">
        <span>14</span>
        <button class="menos-talla">−</button>
        <span class="cantidad-talla">0</span>
        <button class="mas-talla">+</button>
      </div>

      <div class="talla-control" data-talla="16">
        <span>16</span>
        <button class="menos-talla">−</button>
        <span class="cantidad-talla">0</span>
        <button class="mas-talla">+</button>
      </div>

      <button class="close-btn" id="closeModal">Cerrar</button>
    </div>
  </div>






  <!-- Productos dinámicos -->
  <div class="cart-items"></div>

  <!-- FOOTER -->
  <div class="cart-footer">
    <span id="total-price">$0</span>
    <button class="pay">Realizar Pedido <i class="fa-brands fa-whatsapp"></i></button>
  </div>

  <script src="./js/menu.js"></script>
</body>
</html>
